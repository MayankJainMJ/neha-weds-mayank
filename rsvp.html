<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP — Neha & Mayank</title>
  <meta name="description" content="We are saving you a seat by the bonfire. RSVP by 31 October 2026.">
  <meta property="og:title" content="RSVP — Neha & Mayank, Pawna 2026">
  <meta property="og:description" content="We are saving you a seat by the bonfire. RSVP by 31 October 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Crect x=%271%27 y=%272%27 width=%272%27 height=%272%27 fill=%27%23e85d75%27/%3E%3Crect x=%275%27 y=%272%27 width=%272%27 height=%272%27 fill=%27%23e85d75%27/%3E%3Crect x=%271%27 y=%273%27 width=%276%27 height=%272%27 fill=%27%23e85d75%27/%3E%3Crect x=%272%27 y=%275%27 width=%274%27 height=%271%27 fill=%27%23e85d75%27/%3E%3Crect x=%273%27 y=%276%27 width=%272%27 height=%271%27 fill=%27%23a4133c%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=59">
</head>
<body class="bg-sakura rsvp-page">
<script src="js/theme.js"></script>

  <div class="deadline-banner">RSVP by 31 October 2026</div>

  <header class="invite-hero wrap" style="padding-top:1.1rem;padding-bottom:.3rem">
    <p class="greet-line reveal" id="greet" hidden></p>
  </header>

  <main class="section wrap" style="padding-top:.4rem;padding-bottom:0">
    <div class="saved-banner" id="savedBanner" role="status" aria-live="polite"></div>
    <button type="button" class="btn btn-ghost" id="editRsvp" hidden style="width:100%;margin-bottom:.6rem;font-size:.85rem;padding:10px 16px">&#9999;&#65039; Edit my RSVP</button>

    <form id="rsvpForm" class="card-dark gold-frame" novalidate>
      <h1 class="names form-title" style="font-size:clamp(1.15rem,4.6vw,1.5rem);text-align:center;margin-bottom:.6rem">We&rsquo;re saving you a seat<br>by the bonfire</h1>
      <div class="form-group">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="40" autocomplete="name" placeholder="Sharma ji's beta" required>
      </div>

      <div class="form-group">
        <label>Are you coming?</label>
        <div class="choice-row" id="attendRow">
          <label class="choice"><input type="radio" name="attending" value="yes">Obviously</label>
          <label class="choice"><input type="radio" name="attending" value="no">Can't make it</label>
        </div>
      </div>

      <div id="detailsBlock">
        <div class="form-group">
          <label>When are you arriving?</label>
          <div class="choice-row cols" id="arrivalRow">
            <label class="choice"><input type="radio" name="arrivalDay" value="2">2 Dec — up early</label>
            <label class="choice"><input type="radio" name="arrivalDay" value="3">3 Dec — straight to the wedding</label>
          </div>
        </div>

        <div class="form-group">
          <label>Are you bringing a +1?</label>
          <div class="choice-row cols" id="plusRow">
            <label class="choice"><input type="radio" name="plusOne" value="no" checked>Just me</label>
            <label class="choice"><input type="radio" name="plusOne" value="yes">Yes — plus one</label>
          </div>
        </div>

        <div class="form-group" id="plusNameGroup" style="display:none;margin-bottom:.4rem">
          <input type="text" id="plusName" maxlength="40" placeholder="Your +1's name" aria-label="Your +1's name">
        </div>

      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">Submit</button>
      <p class="tent-line">No RSVP by 31 October? You sleep in the camp tent. On the floor.</p>
    </form>
  </main>

  <nav class="wrap foot-nav" aria-label="Continue">
    <a class="footlink" href="invite.html">&larr; Return to invitation</a>
    <span aria-hidden="true" class="foot-dot">&middot;</span>
    <button type="button" class="footlink" id="lbOpen">Top players</button>
  </nav>

  <div class="lb-modal" id="lbModal" hidden>
    <div class="lb-box card-dark gold-frame" role="dialog" aria-modal="true" aria-label="Top Players">
      <button type="button" class="lb-close" id="lbClose" aria-label="Close">&times;</button>
      <p class="lead" style="font-size:1rem"><b>&#127942; Top Players &#10022;</b></p>
      <div id="lbRows" style="margin-top:.7rem"></div>
      <a class="btn btn-ghost" style="margin-top:1rem;font-size:.85rem;padding:10px 22px" href="index.html">&#9654; Beat them &mdash; play the game</a>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/sakura.js?v=2"></script>
  <script src="js/lotus.js"></script>
  <script src="js/story.js"></script>
  <script src="js/store.js"></script>
  <script src="js/rsvp.js"></script>
  <script type="module" src="js/cloud.js"></script>
</body>
</html>
